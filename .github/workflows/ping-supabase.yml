name: Ping Supabase DB

on:
  schedule:
    # Se ejecuta cada 5 días a las 09:00 UTC
    - cron: '0 9 */5 * *'
  workflow_dispatch: # permite ejecutarlo manualmente desde GitHub también

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"